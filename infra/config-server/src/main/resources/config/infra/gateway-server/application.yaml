server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        # 1. Заявки на участие
        - id: request_service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**

        # 2. Комментарии
        - id: comment_service
          uri: lb://comment-service
          predicates:
            - Path=/events/*/comments/**, /users/*/comments/**, /admin/comments/**

        # 3. События
        - id: event_service
          uri: lb://event-service
          predicates:
            - Path=/events/**, /users/*/events/**, /admin/events/**

        # 4. Пользователи
        - id: user_service
          uri: lb://user-service
          predicates:
            - Path=/users/**, /admin/users/**

        # 5. Категории
        - id: category_service
          uri: lb://category-service
          predicates:
            - Path=/categories/**, /admin/categories/**

        # 6. Подборки
        - id: compilation_service
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**

        # 7. Статистика
        - id: stats_service
          uri: lb://stats-server
          predicates:
            - Path=/hit, /stats/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG